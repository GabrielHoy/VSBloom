name: Build Native Platform Binaries

# Artifacts generated by this workflow should be downloadable from
# the run summary once complete.
on:
    workflow_dispatch:
        inputs:
            ref:
                description:
                    'Branch or commit SHA to build - leave blank to use the branch you triggered
                    this on'
                required: false
                default: ''

jobs:
    # We'll build proper native binaries for each target platform - nice and parallelized
    build:
        name: Build Native - ${{ matrix.slug }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false # we'll finish all platforms regardless of failure(s) for now
            matrix:
                include:
                    - os: windows-latest
                      slug: win32-x64 # Windows x64
                    - os: ubuntu-latest # Ubuntu LTS
                      slug: linux-x64 # Linux x64
                    - os: macos-15-intel # Intel x64
                      slug: darwin-x64 # Darwin(macOS) x64
                    - os: macos-15 # Apple Silicon (M1/M2/M3)
                      slug: darwin-arm64 # Darwin(macOS) arm64

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref }}

            # Ninja is pre-installed on windows-latest via VS Build Tools,
            # though Linux and macOS runners don't include it by default
            - name: Linux - Install Ninja
              if: runner.os == 'Linux'
              run: sudo apt-get install -y ninja-build

            - name: macOS - Install Ninja
              if: runner.os == 'macOS'
              run: brew install ninja

            # Sets up cl.exe, link.exe, and the Windows SDK in PATH so that
            # Ninja + MSVC works correctly (Ninja doesn't auto-detect VS like the
            # Visual Studio generator does).
            - name: Windows - Setup MSVC developer environment
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            # Clone and bootstrap vcpkg w/ the exact baseline commit specified in
            # vcpkg-configuration.json, then set VCPKG_ROOT properly.
            # This action should also layers GitHub's cache on top so re-runs that hit the
            # cache skip the clone+bootstrap entirely, in theory.
            - name: Setup vcpkg
              uses: lukka/run-vcpkg@v11
              with:
                  vcpkgDirectory: '${{ github.workspace }}/vcpkg'
                  vcpkgGitCommitId: 'd015e31e90838a4c9dfa3eed45979bc70d9357fc'

            # Configure picks up CMAKE_TOOLCHAIN_FILE from the base preset via
            # $env{VCPKG_ROOT}. vcpkg manifest mode should then auto-install all deps
            # declared in src/Native/cpp/vcpkg.json during this step to get us nice and
            # ready to build.
            - name: Configure
              working-directory: src/Native/cpp
              run: cmake --preset ninja-release

            - name: Build
              working-directory: src/Native/cpp
              run: cmake --build --preset ninja-release

            # Install the binary to a staging area, then copy it into its
            # platform-slug subdirectory so the combined artifact is pre-organized
            # for a clean artifact structure when we're over in TypeScript-land
            #
            # This should end up looking something like `native/<platform>/VSBloomNativeRuntime[<.exe>]`:
            - name: Stage binary
              shell: bash
              run: |
                  cmake --install src/Native/cpp/build/ninja-release \
                    --prefix native-out \
                    --config Release
                  mkdir -p "native/${{ matrix.slug }}"
                  find native-out/bin -name "VSBloomNativeRuntime*" \
                    -exec cp {} "native/${{ matrix.slug }}/" \;

            - name: Upload platform artifact
              uses: actions/upload-artifact@v4
              with:
                  name: native-${{ matrix.slug }}
                  path: native/ # preserves the slug/ subdirectory in the artifact

    # ---------------------------------------------------------------------------
    # Collect all four platform artifacts into one downloadable zip.
    # ---------------------------------------------------------------------------
    collect:
        name: Collect all platform binaries
        needs: build
        runs-on: ubuntu-latest
        steps:
            # merge-multiple: true flattens across artifacts but preserves
            # per-artifact subdirectories, giving us the slug/ layout we want.
            - name: Download all platform artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: native-*
                  path: native
                  merge-multiple: true

            - name: Upload combined artifact
              uses: actions/upload-artifact@v4
              with:
                  name: VSBloomNativeRuntime-all-platforms
                  path: native/
                  retention-days: 30
